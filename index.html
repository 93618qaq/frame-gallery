<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f2">
<title>裱框集錦｜松風閣畫廊</title>
<link rel="stylesheet" href="展覽四步.css?v=20261117-mobile2">
<script src="展覽四步.js?v=20261117" defer></script>

<style>
@font-face{font-family:'Noto Serif TC';src:url('NotoSerifTC-展覽補字.woff2?v=20261117') format('woff2');font-weight:700 900;font-display:swap}
@font-face{font-family:Inter;src:url('InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Noto Sans TC';src:url('NotoSansTC-展覽補字.woff2?v=20261117all') format('woff2');font-weight:300 700;font-display:swap}
/* 畫廊白牆：作品照片是主角，頁面本身安靜；一個松綠色 */
:root{color-scheme:light;--wall:#faf7f2;--paper:#fff;--mat:#ece8df;--ink:#1c1a17;--mute:#5d5a52;--line:#ddd8cd;--pine:#1c1a17;--pine-d:#000;--pine-t:#e9e4d9;--warn:#6f5210;--warnbg:#f6eed7}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.75 Inter,'Noto Sans TC',sans-serif;overflow-x:hidden}
button,summary,input{font:inherit}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a:focus-visible,button:focus-visible,summary:focus-visible,li:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
.step-title:focus,[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible,.hero2-stage:focus,.hero2-stage:focus-visible{outline:none!important}
/* 程式把焦點放到頁面標題（給螢幕閱讀器用）時，不顯示瀏覽器預設的藍色外框；按鈕和連結的鍵盤焦點框仍保留 */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--pine);width:0;z-index:50}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 5vw;background:#faf7f2ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header a{color:inherit;text-decoration:none}
header p{margin:0;font-size:15px;color:var(--mute)}
header .brand-logo{display:block;height:48px;width:auto;max-width:52vw}
header .nav-link{color:var(--pine);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
header>a:first-child{display:inline-flex;align-items:center;min-height:44px}
main{max-width:1120px;margin:0 auto;padding:6px 5vw 130px}
/* 步驟列 */
.steps{display:flex;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:12px 4px 11px;color:var(--mute);text-decoration:none;font-size:16px;border-bottom:3px solid transparent;margin-bottom:-1px}
.step>span:first-child{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;border:1px solid currentColor}
a.step:hover{color:var(--pine)}
.step.done{color:var(--ink)}.step.done>span:first-child{background:var(--pine-t);border-color:var(--pine-t);color:var(--pine)}
.step.now{color:var(--ink);font-weight:700;border-bottom-color:var(--pine)}.step.now>span:first-child{background:var(--pine);border-color:var(--pine);color:#fff}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--pine);text-decoration:none;font-weight:600;font-size:16px;margin:6px 0 0}
.back:hover{text-decoration:underline}
.step-title{margin:18px 0 6px;font-size:clamp(28px,4.4vw,40px);line-height:1.25;font-weight:700;letter-spacing:.01em}
.sub{margin:0 0 20px;max-width:34em;color:var(--mute);font-size:18px}
/* 第 1 步 */
.pills{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.pill{display:inline-flex;align-items:center;min-height:46px;padding:8px 18px;border:1px solid #bab4a6;border-radius:999px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:17px}
a.pill:hover{border-color:var(--pine);color:var(--pine)}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
.pill small{margin-left:8px;font-size:14px;opacity:.8}
.hint{margin:6px 0 0;color:var(--mute);font-size:16px}
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin-top:22px}
.wcard{display:block;color:inherit;text-decoration:none}
.wcard .image-wrap{background:var(--mat);border-radius:4px;overflow:hidden}
.wcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;padding:22px;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.wcard:hover img{transform:scale(1.035)}
.card-info{padding:14px 2px 0}
.card-info b{display:block;font-size:22px;line-height:1.4}
.card-info span{display:block;color:var(--mute);font-size:16px}
.card-info .card-action{margin-top:6px;color:var(--pine);font-weight:700}
.wcard:hover .card-action{text-decoration:underline}
/* 第 2 步 */
.method-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:6px}
.method-card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.method-card:hover{border-color:var(--pine);box-shadow:0 10px 26px #0000001a}
.method-card strong{padding:18px 20px 0;font-size:21px;line-height:1.4}
.method-card .desc{padding:4px 20px 0;color:var(--mute);font-size:16px}
.method-card .desc.flow{padding-top:8px;color:var(--pine);font-size:15px}
.method-card .method-count{margin-top:auto;padding:12px 20px 20px;color:var(--pine);font-weight:700;font-size:16px}
.mini{height:330px;display:flex;justify-content:center;align-items:center;perspective:1100px;overflow:hidden;background:var(--mat)}
.mini .stack{transform:rotateX(58deg) rotateZ(-34deg) scale(.4) translateY(200px);top:78px}
/* 分層圖 */
.stack{position:relative;width:190px;height:274px;transform-style:preserve-3d;--gap:3px}
.stack.open{--gap:62px}
.ly{position:absolute;inset:0;transform:translateZ(calc(var(--i)*var(--gap)));transition:transform .6s cubic-bezier(.2,.8,.2,1),outline-color .2s;outline:2px solid transparent;box-shadow:0 12px 22px #00000026}
.ly.hl{outline-color:var(--pine)}
.ly.frame{--t:20px;box-shadow:none;filter:drop-shadow(0 8px 8px #00000040)}
.ly.frame.inner{inset:20px;--t:11px}.ly.frame.thin{--t:11px}
.ly.frame .fb{position:absolute;background:url(images/tex_wood_h.jpg) center/cover}
.ly.frame .fb.l,.ly.frame .fb.r{background-image:url(images/tex_wood_v.jpg)}
.ly.frame.thin .fb{filter:brightness(1.55) saturate(.7)}
.ly.frame.alu .fb{background:linear-gradient(135deg,#f2f2f0,#b9bbbd 45%,#e7e8e9 70%,#a9abad)}
.ly.frame .fb.t{left:0;top:0;width:100%;height:var(--t);clip-path:polygon(0 0,100% 0,calc(100% - var(--t)) 100%,var(--t) 100%)}
.ly.frame .fb.b{left:0;bottom:0;width:100%;height:var(--t);clip-path:polygon(var(--t) 0,calc(100% - var(--t)) 0,100% 100%,0 100%)}
.ly.frame .fb.l{left:0;top:0;height:100%;width:var(--t);clip-path:polygon(0 0,100% var(--t),100% calc(100% - var(--t)),0 100%)}
.ly.frame .fb.r{right:0;top:0;height:100%;width:var(--t);clip-path:polygon(0 var(--t),100% 0,100% 100%,0 calc(100% - var(--t)))}
.ly.glass{background:linear-gradient(115deg,#ffffff66 0 28%,#ffffff12 28% 58%,#ffffff44 58% 68%,#ffffff0a 68%),#a9c6d733;border:1px solid #ffffffd9;box-shadow:0 0 0 1px #6f93ab66,0 14px 24px #0000001f}
.ly.art{inset:16px;overflow:hidden;background:#c9bfa8}
.ly.art img{position:absolute;left:50%;top:50%;width:150%;transform:translate(-50%,-50%)}
.ly.fboard{inset:12px;background:#fbfaf6;box-shadow:0 10px 18px #0000002e;transform-style:preserve-3d}
/* 浮板的白板和背面兩條木條是一體的：木條貼在白板背面，跟著白板一起動 */
.ly.fboard .st{position:absolute;top:0;bottom:0;width:24px;background:url(images/tex_edge_v.jpg) center/cover;filter:saturate(.75) brightness(.92);box-shadow:0 8px 12px #00000040;transform:translateZ(calc(var(--gap,3px)*-.45))}
.ly.fboard .st.l{left:22px}.ly.fboard .st.r{right:22px}
.ly.riser{box-shadow:none}
.ly.riser .st{position:absolute;top:12px;bottom:12px;width:24px;background:url(images/tex_edge_v.jpg) center/cover;filter:saturate(.75) brightness(.92);box-shadow:0 8px 12px #00000040}
.ly.riser .st.l{left:34px}.ly.riser .st.r{right:34px}
.ly.board{inset:6px;background:linear-gradient(135deg,#dac793,#cdb783);border:1px solid #b19d6b}
.mpanel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px;overflow:hidden;margin-top:10px}
.mpanel h3{margin:0 0 4px;font-size:22px}
.mpanel p{margin:4px 0 14px;color:var(--mute)}
.btn{min-height:46px;padding:8px 24px;border:1px solid var(--pine);border-radius:999px;background:var(--pine);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-d)}
.layerlist{list-style:none;margin:16px 0 0;padding:0}
.layerlist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;font-size:16px;cursor:pointer}
.layerlist li:hover,.layerlist li.on{background:var(--pine-t)}
.layerlist i{flex:none;width:14px;height:14px;border-radius:3px;border:1px solid #00000040}
.warn{margin-top:16px;padding:8px 12px;border-radius:4px;background:var(--warnbg);color:var(--warn);font-size:14px;line-height:1.6}
.scene{position:relative;perspective:1500px;height:520px;display:flex;justify-content:center;align-items:center}
.mpanel .stack{transform:rotateX(60deg) rotateZ(-34deg) translate(-60px,175px) scale(.86)}
.mpanel .stack.open{--gap:62px}
/* 第 3、4 步 */
.switch{margin:6px 0 4px}
.view-heading{margin:44px 0 4px;font-size:24px;line-height:1.4}
.view-heading small{margin-left:10px;font-size:15px;font-weight:400;color:var(--mute)}
.view-help{margin:4px 0 16px;color:var(--mute);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.ph{padding:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;transition:border-color .2s,box-shadow .2s}
.ph:hover{border-color:var(--pine);box-shadow:0 10px 26px #0000001a}
.ph img{display:block;width:100%;height:440px;object-fit:contain;padding:14px;background:var(--mat)}
.ph>span{display:block;padding:12px 16px 16px;font-size:16px;line-height:1.6}
.ph em{display:inline-block;margin:4px 6px 0 0;padding:1px 9px;border-radius:4px;background:var(--pine-t);color:var(--pine);font-style:normal;font-size:14px}
.ph em.none{background:var(--warnbg);color:var(--warn)}
.photo-hint{display:block;margin-top:8px;color:var(--pine);font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0}
.chip{min-height:48px;padding:10px 18px;border:1px solid #bab4a6;border-radius:999px;background:var(--paper);color:var(--ink);font-size:16px;cursor:pointer}
.chip:hover{border-color:var(--pine)}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.compare-status{margin:12px 0;color:var(--pine);font-size:16px;font-weight:600}
.compare-scroll{overflow-x:auto;padding-bottom:12px}
.cmp{display:grid;gap:18px}
.cmp.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.cmp.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp .col{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.cmp .col button{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;cursor:pointer}
.cmp img{display:block;width:100%;height:440px;object-fit:contain;background:var(--mat)}
.cmp b{display:block;margin:12px 0 2px;font-size:20px}
.cmp small{color:var(--mute);font-size:15px}
.notice{margin-top:32px;color:var(--mute)}
.notice summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.notice .grid{margin-top:12px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 5vw;background:#faf7f2f2;backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .back{margin:0}
.next{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 28px;border-radius:4px;background:var(--pine);color:#fff;text-decoration:none;font-size:18px;font-weight:700}
.next:hover{background:var(--pine-d)}
.next.off{background:transparent;border:1px dashed #bab4a6;color:var(--mute);font-size:15px;font-weight:400}
dialog{max-width:96vw;max-height:96vh;padding:0;border:0;background:transparent;overflow:visible;width:max-content}
dialog::backdrop{background:#15110de6}
dialog .box{position:relative;padding-top:52px;text-align:center}
dialog img{max-width:94vw;max-height:74vh;object-fit:contain;border-radius:4px}
dialog p{max-width:85vw;margin:10px auto 0;color:#eee;font-size:15px}
dialog button{position:absolute;top:0;right:0;min-height:42px;padding:8px 20px;border:0;border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
#proto{max-width:1120px;margin:0 auto;padding:0 5vw 28px;color:var(--mute);font-size:13px}
footer{display:flex;justify-content:space-between;gap:20px;margin:0 5vw;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer b{color:var(--ink);font-weight:600}
/* 首頁第一眼：一張大的分層拆開圖 */
.hero2{--strip:clamp(176px,24vh,300px);position:relative;height:calc(100vh - 84px);min-height:560px;max-height:820px}
.hero2-copy{position:relative;z-index:3;padding-top:30px;pointer-events:none}
.hero2-copy a,.hero2-copy button{pointer-events:auto}
.hero2-copy h1{text-wrap:balance;margin:0;font-size:clamp(32px,4.4vw,84px);line-height:1.2;font-weight:700;letter-spacing:.01em}
.hero2-copy p{margin:16px 0 0;max-width:min(22em,30vw);color:var(--mute);font-size:clamp(17px,1.3vw,24px)}
.stats{display:flex;gap:clamp(26px,3.2vw,64px);margin-top:clamp(28px,6vh,72px)}
.stats b{display:block;font-size:clamp(34px,3.6vw,68px);line-height:1;font-weight:700;letter-spacing:-.01em}
.stats span{display:block;margin-top:8px;max-width:9em;font-size:clamp(14px,.95vw,17px);line-height:1.5;color:var(--mute)}
.hero2-stage{position:absolute;inset:0 0 var(--strip) 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hstack{position:absolute;left:60%;top:calc(54% + var(--dy,0px));width:190px;height:274px;margin:-137px 0 0 -95px;transform-style:preserve-3d;--rx:60deg;--rz:-34deg;--sc:1.2;transform:rotateX(var(--rx)) rotateZ(var(--rz)) scale(var(--sc));--gap:3px}
.hstack.open{--gap:64px}
.hstack.nt .ly,.hstack.nt .hsh{transition:none!important;animation:none!important}
.hstack .ly{transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity .3s}
/* 特效：展間聚光、光束、飄浮微塵、地面影子、壓克力掃光、逐層落下 */
body.home{background:radial-gradient(ellipse 58% 80% at 64% 50%,#fffdf9 0,#faf7f2 40%,#f2ede3 78%,#eae4d8 100%) fixed}
body.home header{background:transparent;backdrop-filter:none;border-bottom-color:transparent;transition:background .3s,border-color .3s}
body.home.scrolled header{background:#faf7f2ee;backdrop-filter:blur(10px);border-bottom-color:var(--line)}
.hbeam{position:absolute;left:calc(64% - 45vw);top:-84px;width:90vw;height:108%;pointer-events:none;background:conic-gradient(from 180deg at 50% 0,#ffe9a800 0 158deg,#ffe9a84a 170deg,#ffe3909c 180deg,#ffe9a84a 190deg,#ffe9a800 202deg 360deg);-webkit-mask-image:linear-gradient(#000 0,#0000 92%);mask-image:linear-gradient(#000 0,#0000 92%);opacity:.8;animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.55}to{opacity:.85}}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:#cdb06a;box-shadow:0 0 8px 3px #fff3c4;opacity:0;animation:mote var(--d) linear infinite var(--dl)}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.75}80%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-110px)}}
.hsh{position:absolute;inset:-30px;transform:translateZ(calc(var(--gap)*-.3 - 14px));background:radial-gradient(closest-side,#00000085 0,#00000040 55%,#0000 100%);transition:transform 1.3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.h-glass{overflow:hidden}
.h-glass:after,.ly.glass:after{content:'';position:absolute;inset:-20% -80%;background:linear-gradient(105deg,#fff0 40%,#ffffffc8 50%,#fff0 60%);transform:translateX(-70%);animation:sheen 6s ease-in-out 2.4s infinite;pointer-events:none}
.ly.glass{overflow:hidden}
@keyframes sheen{0%{transform:translateX(-70%)}40%,100%{transform:translateX(70%)}}
.h-art:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,#ffffff55,#fff0 55%);pointer-events:none}
@keyframes drop{from{translate:0 0 300px;opacity:0}to{translate:0 0 0;opacity:1}}
.hstack.enter .ly{animation:drop .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.11s)}
.hstack .ly{transition:transform 1.3s cubic-bezier(.2,.8,.2,1),translate .3s,outline-color .2s}
.hstack .ly.hot{translate:0 0 26px;outline:2px solid #1c1a17;outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero2-copy h1{animation:rise .9s cubic-bezier(.2,.8,.2,1) .1s backwards}
.hero2-copy p{animation:rise .9s cubic-bezier(.2,.8,.2,1) .3s backwards}
.hero2-act{animation:rise .9s cubic-bezier(.2,.8,.2,1) .5s backwards}
.h-frame{box-shadow:none;filter:drop-shadow(0 8px 8px #00000040)}
.h-frame .fb{position:absolute;background:url(images/tex_wood_h.jpg) center/cover}
.h-frame .fb.l,.h-frame .fb.r{background-image:url(images/tex_wood_v.jpg)}
.h-frame .fb.t{left:0;top:0;width:100%;height:20px;clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,20px 100%)}
.h-frame .fb.b{left:0;bottom:0;width:100%;height:20px;clip-path:polygon(20px 0,calc(100% - 20px) 0,100% 100%,0 100%)}
.h-frame .fb.l{left:0;top:0;height:100%;width:20px;clip-path:polygon(0 0,100% 20px,100% calc(100% - 20px),0 100%)}
.h-frame .fb.r{right:0;top:0;height:100%;width:20px;clip-path:polygon(0 20px,100% 0,100% 100%,0 calc(100% - 20px))}
.h-glass{background:linear-gradient(115deg,#ffffff66 0 28%,#ffffff12 28% 58%,#ffffff44 58% 68%,#ffffff0a 68%),#a9c6d733;border:1px solid #ffffffd9;box-shadow:0 0 0 1px #6f93ab66,0 14px 24px #0000001f}
.h-art{inset:16px;overflow:hidden;background:#c9bfa8}
.h-art img{position:absolute;left:50%;top:50%;width:150%;transform:translate(-50%,-50%)}
.h-fboard{inset:12px;background:#fbfaf6;box-shadow:0 10px 18px #0000002e}
.h-riser{box-shadow:none}
.h-riser .st{position:absolute;top:12px;bottom:12px;width:24px;background:url(images/tex_edge_v.jpg) center/cover;filter:saturate(.75) brightness(.92);box-shadow:0 8px 12px #00000040}
.h-riser .st.l{left:34px}.h-riser .st.r{right:34px}
.h-board{inset:6px;background:linear-gradient(135deg,#dac793,#cdb783);border:1px solid #b19d6b}
.hlead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hlead *{stroke:#1c1a17;stroke-width:1}
.hlab{position:absolute;z-index:5;white-space:nowrap;font-size:17px;opacity:0;transition:opacity .5s,color .2s,transform .2s;pointer-events:none;padding:4px 10px 4px 0}
.hlab b{display:inline-block;width:1.6em;font-weight:700}
.hlab.hot{transform:translateX(6px);font-weight:700}
.hlead{opacity:0;transition:opacity .5s}
.hero2-stage.on .hlab,.hero2-stage.on .hlead{opacity:1}
.hero2-stage.on .hlab{pointer-events:auto;cursor:default}
.hlead .hl.hot *{stroke-width:2.4}

<script src="data_新概念.js?v=20261117a"></script>
<script>
const D=window.DATA,$=s=>document.getElementById(s);
/* 番薯 11/6 指定：先只用王蟲海報；要放開別的作品，把下一行改成 null 即可 */
const ALL_CATS=D.cats.map(c=>({...c}));
/* 11/17 番薯說「好，開始接」＝官網 484 筆全放：改成 null（資料檔已由 接484筆_建資料.py 補齊）。要回到只放王蟲，改回 'wangchong'。 */
const ONLY_WORK=null;
const protoText=()=>'目前收錄官網 '+D.photos.length+' 張成品照、'+D.methods.length+' 種做法；做法只標標題上寫明的，其餘寫「做法待確認」。';
if(ONLY_WORK){D.works=D.works.filter(w=>w.id===ONLY_WORK);D.photos=D.photos.filter(p=>p.work===ONLY_WORK);const used=new Set(D.photos.flatMap(p=>p.m));D.methods=D.methods.filter(m=>used.has(m.id));D.cats=ALL_CATS}
const W=Object.fromEntries(D.works.map(w=>[w.id,w])),M=Object.fromEntries(D.methods.map(m=>[m.id,m])),C=Object.fromEntries(D.cats.map(c=>[c.id,c]));
const LAYERCOLOR={frame:'#6b4a2f',glass:'#a9d3ea',art:'#c9bfa8',riser:'#c9a56a',fboard:'#f1eee6',board:'#cbbd9f'};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const st={cmp:null,open:false,view:'photos',key:null};
let scrollFrame=0;addEventListener('scroll',()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;document.body.classList.toggle('scrolled',scrollY>24)})},{passive:true});
const photosOf=w=>D.photos.filter(p=>p.work===w);
const worksOf=c=>D.works.filter(w=>w.cat===c);
const methodsOf=w=>{const c={};photosOf(w).forEach(p=>p.m.forEach(m=>c[m]=(c[m]||0)+1));return D.methods.filter(m=>c[m.id]).map(m=>({...m,n:c[m.id]}))};
// Assign a different real photo to every compared method; overlapping tags may need reassignment.
function comparisonPhotos(w,ids){
 if(!w||ids.length<2||ids.length>3||new Set(ids).size!==ids.length)return null;
 const ps=photosOf(w.id),owners=new Map(),chosen=new Map();
 function assign(id,seen){
  for(const p of ps){
   if(!p.m.includes(id)||seen.has(p.id))continue;
   seen.add(p.id);const owner=owners.get(p.id);
   if(owner===undefined||assign(owner,seen)){owners.set(p.id,id);chosen.set(id,p);return true}
  }
  return false;
 }
 for(const id of ids)if(!assign(id,new Set()))return null;
 return ids.map(id=>chosen.get(id));
}
function comparisonStart(w,m){
 if(!w)return null;
 const ms=methodsOf(w.id),first=ms.find(k=>k.id===m?.id)||ms[0];
 if(!first)return null;
 for(const other of ms){const ids=[first.id,other.id];if(other.id!==first.id&&comparisonPhotos(w,ids))return ids}
 return null;
}
const parse=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const href=o=>'#'+new URLSearchParams(o).toString();
const thumb=p=>'images/t'+p.id+'.jpg',big=p=>'images/b'+p.id+'.jpg';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function stepper(n,w,m,c){
 const items=[['選作品',w?href({c:w.cat}):'#'],['選做法',w?href({w:w.id}):null],['看成品',w&&m?href({w:w.id,m:m.id}):null],['比一比',null]];
 return '<nav class="steps" aria-label="目前在第 '+n+' 步，共 4 步">'+items.map(([t,link],i)=>{
  const k=i+1,cls=k===n?'now':k<n?'done':'pend',inner=''+(k<n?'<span class="tick">✓</span>':'<span>'+k+'</span>')+'<span>'+t+'</span>';
  return (k<n&&link)?'<a class="step done" href="'+link+'" aria-label="回到第 '+k+' 步：'+t+'">'+inner+'</a>':'<span class="step '+cls+'"'+(k===n?' aria-current="step"':'')+'>'+inner+'</span>'}).join('')+'</nav>';
}
const back=(link,label)=>'<a class="back" href="'+link+'">← '+label+'</a>';
const head=(t,sub)=>'<h1 class="step-title" id="stepTitle" tabindex="-1">'+t+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'');
const exhibitHead=(n,t,sub)=>'<div class="ex-heading"><div><p class="ex-kicker">松風閣・裱框選集 <span>／ '+['','選作品','選做法','看成品','比一比'][n]+'</span></p>'+head(t,sub)+'</div><span class="ex-chapter" aria-hidden="true">0'+n+'</span></div>';

const workCard=(w,i)=>{const ps=photosOf(w.id),c=D.photos.find(p=>p.id===w.cover),ms=methodsOf(w.id);
 return '<a class="wcard" href="'+href({w:w.id})+'"><div class="image-wrap"><img loading="lazy" src="'+thumb(c)+'" alt="'+esc(w.name)+'裱框範例"></div><div class="card-info"><b>'+esc(w.name)+'</b><span>'+ps.length+' 張照片　／　'+(ms.length?ms.length+' 種做法':'做法待確認')+'</span><span class="card-action">選這一件 →</span></div></a>'};

const exhibitWorkCard=(w,i)=>{const ps=photosOf(w.id),c=D.photos.find(p=>p.id===w.cover),ms=methodsOf(w.id);
 return '<a class="wcard" href="'+href({w:w.id})+'"><div class="image-wrap"><span class="ex-art-no" aria-hidden="true">'+String((i||0)+1).padStart(2,'0')+'</span><img loading="lazy" src="'+big(c)+'" alt="'+esc(w.name)+'裱框範例"><span class="ex-art-arrow" aria-hidden="true">↗</span></div><div class="card-info"><b>'+esc(w.name)+'</b><span>'+ps.length+' 張照片　／　'+(ms.length?ms.length+' 種已確認做法':'做法待確認')+'</span><span class="card-action">探索這件作品 →</span></div></a>'};
function step1(cid){
 const ok=D.cats.filter(k=>worksOf(k.id).length),cur=C[cid]&&worksOf(cid).length?C[cid]:ok[0];
 return stepper(1)+exhibitHead(1,'每件作品，<br>都有另一種可能。','先選一件，看看裱框如何改變它的表情。')+
 '<div class="ex-selection"><div class="ex-filter"><span class="ex-label">從作品種類開始</span><div class="pills" role="group" aria-label="作品種類">'+ok.map(k=>'<a class="pill'+(k.id===cur.id?' on':'')+'" href="'+href({c:k.id})+'"'+(k.id===cur.id?' aria-current="true"':'')+'>'+esc(k.name)+'<small>'+worksOf(k.id).length+'</small></a>').join('')+'</div><p class="hint">'+esc(cur.hint)+'</p></div><div class="ex-collection"><div class="ex-collection-title"><h2>'+esc(cur.name)+'</h2><span>'+String(worksOf(cur.id).length).padStart(2,'0')+' 件作品 ↓</span></div><div class="works">'+worksOf(cur.id).map(exhibitWorkCard).join('')+'</div></div></div>';
}
function miniStack(m){const L=m.layers,n=L.length;return '<div class="mini"><div class="stack open" style="--g:'+(n>4?50:64)+'px">'+L.map((l,i)=>layerEl(l,i,n,'images/t451.jpg')).join('')+'</div><span class="ex-model-note">裱框分層示意</span></div>'}
function selectedWork(w){const p=D.photos.find(p=>p.id===w.cover);return '<aside class="ex-selected"><div class="ex-selected-image"><img class="ex-continuity" src="'+big(p)+'" alt="'+esc(w.name)+'"><span class="ex-wall-caption">你選的作品</span></div><div class="ex-selected-caption"><h2>'+esc(w.name)+'</h2>'+back(href({c:w.cat}),'換一件作品')+'</div></aside>'}
function step2(w){
 const ps=photosOf(w.id),other=ps.filter(p=>!p.m.length),known=methodsOf(w.id);
 const photos=other.length?'<details class="notice ex-unconfirmed" id="ex-photo-section" tabindex="-1" open><summary>'+other.length+' 張實際成品照・做法待確認 ↗</summary><p>先看實際成品，裱框做法尚未逐張確認。點照片可以放大。</p><div class="grid">'+other.map(photoCard).join('')+'</div></details>':'';
 const methods='<div class="method-grid">'+D.methods.map((m,i)=>{
  const matches=ps.filter(p=>p.m.includes(m.id)),p=matches[0];
  return '<a class="method-card" href="'+href({w:w.id,m:m.id})+'"><span class="ex-method-no">'+String(i+1).padStart(2,'0')+'</span>'+(p?'<div class="ex-method-preview"><img loading="lazy" src="'+thumb(p)+'" alt="'+esc(m.name)+'成品"></div>':miniStack(m))+'<div class="ex-method-copy"><strong>'+esc(m.name)+'</strong><span class="desc">'+esc(m.blurb)+'</span><span class="method-count">'+(matches.length?matches.length+' 張成品・看這種做法':'先看分層示意・成品待補')+' ↗</span></div></a>'}).join('')+'</div>';
 const choices=known.length?'<p class="ex-label">為這件作品，探索 '+D.methods.length+' 種做法</p>'+methods:'<details class="ex-layer-details ex-other-methods"><summary><span><small>通用做法示意</small><b>認識其他做法</b></span><span class="ex-plus" aria-hidden="true">＋</span></summary><p class="view-help">以下是通用示意，不代表上方作品的實際結構；適合的做法以店內確認為準。</p>'+methods+'</details>';
 const shortcuts=other.length?'<nav class="ex-method-shortcuts" aria-label="照片與做法捷徑"><button type="button" class="ex-jump" data-jump="methods">'+(known.length?'跳到做法 ↓':'跳到做法示意 ↓')+'</button></nav>':'';
 const options=other.length?'<div id="ex-method-section" tabindex="-1"><button type="button" class="ex-jump ex-jump-back" data-jump="photos">回到照片 ↑</button>'+choices+'</div>':choices;
 return stepper(2,w)+exhibitHead(2,known.length?'換一種框，<br>換一種表情。':'先看成品，<br>再認識做法。',known.length?'從實際成品找靈感，也可以打開分層，認識每一種做法。':'先從實際成品找靈感；做法尚未逐張確認，通用示意放在照片下方。')+shortcuts+'<div class="ex-method-layout">'+selectedWork(w)+'<div class="ex-methods">'+photos+options+'</div></div>';
}

function layerEl(l,i,n,src){
  const [t,name]=l,z=n-1-i;
  let mod='',inner='';
  if(t==='frame'){
    mod=(/內框/.test(name)?' inner':'')+(/鋁/.test(name)?' alu':'')+(/細實木/.test(name)?' thin':'');
    inner='<i class="fb t"></i><i class="fb b"></i><i class="fb l"></i><i class="fb r"></i>';
  }
  if(t==='art')inner='<img src="'+(src||'images/b451.jpg')+'" alt="">';
  if(t==='fboard')inner='<i class="st l"></i><i class="st r"></i>';
  return '<div aria-hidden="true" class="ly '+t+mod+'" data-i="'+i+'" style="--i:'+z+'">'+inner+'</div>';
}
function methodPanel(m){
  const L=m.layers,n=L.length;
  return '<div class="mpanel"><div><h3>'+esc(m.name)+'</h3><p>'+esc(m.blurb)+'</p>'+
    '<button class="btn" id="ex" aria-pressed="'+st.open+'">'+(st.open?'合起來':'分開來看')+'</button>'+
    '<ul class="layerlist" id="ll">'+L.map((l,i)=>'<li><button type="button" data-i="'+i+'"><i style="background:'+LAYERCOLOR[l[0]]+'"></i>'+(i+1)+'　'+esc(l[1])+'</button></li>').join('')+'</ul>'+
    '<div class="warn">這是示意圖，實際做法以店內為準。</div></div>'+
    '<div class="scene"><div class="stack'+(st.open?' open':'')+'" id="stack">'+L.map((l,i)=>layerEl(l,i,n)).join('')+'</div></div></div>';
}
function photoCard(p){
  const tags=p.m.length?p.m.map(id=>'<em>'+esc(M[id].name)+'</em>').join(''):'<em class="none">做法待確認</em>';
  return '<button class="ph" data-id="'+p.id+'"><img loading="lazy" src="'+thumb(p)+'" alt="'+esc(p.t)+'"><span>'+esc(p.t)+'<br>'+tags+'<span class="photo-hint">點一下放大 ↗</span></span></button>';
}

/* 第 3 步：這種做法做好的樣子；下一步按鈕固定在畫面下方 */
function step3(w,m){
 const ps=photosOf(w.id),ms=methodsOf(w.id),shown=ps.filter(p=>p.m.includes(m.id));
 const sw='<div class="pills switch" role="group" aria-label="換看別種做法">'+D.methods.map(k=>'<a class="pill'+(k.id===m.id?' on':'')+'" href="'+href({w:w.id,m:k.id})+'"'+(k.id===m.id?' aria-current="true"':'')+'>'+esc(k.name)+'</a>').join('')+'</div>';
 const hero=shown.length?'<section class="ex-salon" aria-label="成品展牆"><div class="ex-salon-top"><span>成品展牆</span><span id="ex-shot-count">01 / '+String(shown.length).padStart(2,'0')+'</span></div><button class="ex-hero-photo" data-id="'+shown[0].id+'" aria-label="放大成品"><img class="ex-continuity" src="'+big(shown[0])+'" alt="'+esc(shown[0].t)+'"><span>放大看細節 ↗</span></button><div class="ex-shots" role="group" aria-label="選擇成品照片">'+shown.map((p,i)=>'<button data-shot="'+p.id+'" data-shot-index="'+i+'" aria-label="看第 '+(i+1)+' 張：'+esc(p.t)+'" aria-pressed="'+!i+'"><img loading="lazy" src="'+thumb(p)+'" alt=""></button>').join('')+'</div><p class="ex-shot-caption" id="ex-shot-caption">'+esc(shown[0].t)+'</p></section>':'<section class="ex-no-photo"><p class="ex-label">成品照片整理中</p><h2>先認識它的層次。</h2><p>這件作品還沒有「'+esc(m.name)+'」的成品照，下面的分層圖是做法示意。</p></section>';
 let h=stepper(3,w,m)+exhibitHead(3,esc(m.name),'正在欣賞：'+esc(w.name))+sw+hero+
 '<details class="ex-layer-details"><summary><span><small>從成品，走進細節</small><b>打開看看，裡面有哪些層次。</b></span><span class="ex-plus" aria-hidden="true">＋</span></summary><p class="view-help">這是通用做法示意，作品層使用王蟲海報，並非上方每件作品的實際結構。按「分開來看」，再點層的名字看位置。</p>'+methodPanel(m)+'</details>'+
 (shown.length?'<h2 class="view-heading">每個角度，都值得細看。<small>'+shown.length+' 張成品</small></h2><div class="grid ex-photo-grid">'+shown.map(photoCard).join('')+'</div>':'');
 const canCompare=!!comparisonStart(w,m);
 if(!canCompare&&ms.length>=2)h+='<p class="notice" role="status">同一張成品照包含不同做法，目前沒有不同的成品照可並排比較。</p>';
 return h+'<div class="bar">'+back(href({w:w.id}),'回到做法列表')+(canCompare?'<a class="next" href="'+href({w:w.id,m:m.id,s:4})+'">並排，看看差別 ↗</a>':'<span class="next off">'+(ms.length>=2?'暫無不同成品可比較':'目前未有兩種已確認做法可比較')+'</span>')+'</div>';
}
function step4(w,m){
 const ps=photosOf(w.id),ms=methodsOf(w.id);
 const initial=comparisonStart(w,m);if(!initial)return step3(w,m);
 if(!st.cmp||st.cmp.w!==w.id||st.cmp.m!==m.id||!comparisonPhotos(w,st.cmp.sel))st.cmp={w:w.id,m:m.id,sel:initial,message:''};
 const c=st.cmp.sel,pictures=comparisonPhotos(w,c);
 return stepper(4,w,m)+exhibitHead(4,'並排之後，<br>感覺就不一樣了。',esc(w.name)+'・選 2 至 3 種做法，找出你喜歡的表情。')+
 '<div class="ex-compare-controls"><div class="chips pick" role="group" aria-label="比較做法">'+ms.map(k=>'<button class="chip" data-c="'+k.id+'" aria-pressed="'+c.includes(k.id)+'">'+(c.includes(k.id)?'✓ ':'＋ ')+esc(k.name)+'</button>').join('')+'</div><label class="ex-size">照片大小 <input id="ex-compare-size" type="range" min="280" max="600" step="20" value="440"><span aria-hidden="true">− / ＋</span></label></div><p class="compare-status" role="status">已選 '+c.length+' 種'+(st.cmp.message?'　'+esc(st.cmp.message):'・點照片可放大，窄螢幕可左右滑動')+'</p><div class="compare-scroll ex-compare-wall"><div class="cmp n'+c.length+'" style="--cols:'+c.length+'">'+c.map((k,i)=>{const p=pictures[i];return '<div class="col" data-compare-key="'+k+'"><span class="ex-compare-no">0'+(i+1)+'</span><button data-id="'+p.id+'" aria-label="放大'+esc(M[k].name)+'範例"><img src="'+big(p)+'" alt="'+esc(p.t)+'"><b>'+esc(M[k].name)+'</b><small>'+esc(M[k].blurb)+'</small><span class="ex-enlarge">放大看細節 ↗</span></button></div>'}).join('')+'</div></div><p class="ex-footnote">照片取自實際案例，拍攝角度與光線可能不同；此處比較做法與整體感受，並非等比例尺寸模擬。</p>'+
 '<div class="bar">'+back(href({w:w.id,m:m.id}),'回到「'+esc(m.name)+'」')+'<a class="next" href="'+href({c:w.cat})+'">探索下一件作品 ↗</a></div>';
}

/* 首頁：一張大的分層拆開圖，自動拆開，可點一下合起來／再拆開 */
function heroStrip(){
 const w=D.works.find(x=>photosOf(x.id).length);if(!w)return '';
 const ps=photosOf(w.id),seen={},pick=[];
 ps.forEach(p=>{const k=p.m[0]||'x';if(!seen[k]&&pick.length<8){seen[k]=1;pick.push(p)}});
 ps.forEach(p=>{if(pick.length<8&&!pick.includes(p))pick.push(p)});
 return '<div class="hstrip"><h3><span>已整理好的成品　'+esc(w.name)+'</span><a href="'+href({w:w.id})+'">看這件的全部做法 →</a></h3><div class="hrow">'+pick.map(p=>'<button class="hph" data-id="'+p.id+'" aria-label="放大：'+esc(p.t)+'"><img src="'+thumb(p)+'" alt="'+esc(p.t)+'" loading="lazy"></button>').join('')+'</div></div>';
}
/* 逐字拆開（標題彈入用）：英數連續字當一個單位；螢幕閱讀器讀整句，單字全部 aria-hidden */
function kin(s){let k=0;const e=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 return String(s).split('\n').map(line=>(line.match(/[A-Za-z0-9]+|[\s\S]/g)||[]).map(u=>u===' '?' ':'<span class="ch" style="--k:'+(k++)+'">'+e(u)+'</span>').join('')).join('<br>')}
const zh=n=>'零一二三四五六七八九十'[n]||n;
/* 松枝以原生向量描繪，不載入圖片／新函式庫。 */
function pineWind(){
 const fan=(x,y,angle,size)=>{let lines='';for(let i=0;i<13;i++){const a=(-168+i*14)*Math.PI/180,r=size*(.82+Math.sin(i*2.3)*.16);lines+='<path d="M0 4 Q'+(Math.cos(a)*r*.38).toFixed(1)+' '+(Math.sin(a)*r*.7).toFixed(1)+' '+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)+'"/>'}return '<g transform="translate('+x+' '+y+') rotate('+angle+')">'+lines+'</g>'};

}

  const target=e.target.closest('button,a.go,a.next,a.wcard,a.method-card,a.nav-link,a.back,a.step.done,a.pill,a.hm-cat,summary');
  if(!target||target===toggle||target.disabled||target.getAttribute('aria-disabled')==='true')return;
  if(enabled){
   const now=performance.now();if(now-lastTone>=75){lastTone=now;
    const method=target.dataset.method,notes={float:98,alu:110,slim9:130.815,acrylic2:146.83};
    /* 分類：①選做法＝古琴（每種做法一個音）②前進＝古琴上行 ③返回／重新開始＝古琴下行 ④篩選／分類＝木魚 ⑤放大看圖＝玉磬 ⑥關閉放大＝沙沙下行＋低琴 ⑦展開／收合＝卷軸沙沙 ⑧其他按鈕＝輕木魚 */
    if(method){pluck(notes[method],0,1);pluck(notes[method]*2,.018,.12)}
    else if(target.id==='lbx'){swish(-1,.8,0,.2);pluck(82.41,.03,.6)}
    else if(target.dataset.id){bell(target.matches('.hm-t,.hph')?740:659.25,1)}
    else if(target.id==='htog'||target.id==='ex'){const on=target.getAttribute('aria-pressed')==='true';swish(on?1:-1,1);knock(on?780:620,.5,on?.2:.0)}
    else if(target.matches('summary')){const willOpen=!target.closest('details')?.open;swish(willOpen?1:-1,1);knock(willOpen?780:620,.5,willOpen?.2:0)}
    else if(target.matches('.back,.step.done,.nav-link')){pluck(130.815,0,.7);pluck(98,.05,.65)}
    else if(target.matches('.chip,.pill,.hm-cat')){knock(target.matches('.pill,.hm-cat')?680:780,1)}
    else if(target.matches('a.go,a.next,a.wcard,a.method-card')){pluck(98,0,.7);pluck(130.815,.05,.6)}
    else if(target.matches('a')){pluck(98,0,.7);pluck(130.815,.05,.6)}
    else{knock(620,.7)}
   }
  }
  if(!reduceMotion.matches&&target.matches('.atelier-choice,.atelier-photo,.editorial-tile,summary')&&target.animate){target.getAnimations().filter(a=>a.id==='tap-return').forEach(a=>a.cancel());const a=target.animate([{scale:'.97'},{scale:'1.012',offset:.65},{scale:'1'}],{duration:360,easing:'cubic-bezier(.22,1,.36,1)'});a.id='tap-return'}
 });
})();
